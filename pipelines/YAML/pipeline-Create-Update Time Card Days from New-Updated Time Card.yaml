# Create/Update Time Card Days from New/Updated Time Card
#

# Account slugs:
#  - quickbase[oMVjzjY#chartindustries]: Realm Default Account <None>
---
- META:
    name: Create/Update Time Card Days from New/Updated Time Card
    tag_names:
    - Project Activity
    enabled: true
- ACCOUNTS:
  - slug: oMVjzjY#chartindustries
    channel: quickbase
    alias: realm-default-account
    accountType: tokenless
    realm: chartindustries
- TRIGGER quickbase[oMVjzjY#chartindustries] record on_new_event -> aa:
    inputs-meta:
      app: '"Project Activity" <bg86uwfcw>'
      on_add_record: 'true'
      table: '"Time Cards" <bhm9822gc>'
      trigger_fields: '"Date, Sunday, Monday, Tuesday, Wednesday, Thursday, Friday,
        Saturday" <9, 23, 10, 11, 12, 13, 14, 24>'
      trigger_on_all_fields: 'false'
- LOOKUP quickbase[oMVjzjY#chartindustries] record look_up -> ai:
    inputs-meta:
      app: '"Project Activity" <bg86uwfcw>'
      table: '"Time Cards" <bhm9822gc>'
      export_fields: '"Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday,
        Week Beginning, Employee, Business Unit Code, Business Unit Name, Business
        Unit Full Name, Time Card Type, Time Card Title, Project Type, Project Name,
        Billable?" <23, 10, 11, 12, 13, 14, 24, 8, 17, 296, 297, 309, 151, 137, 298,
        300, 299>'
    inputs:
      id: '{{aa.id}}'
- IF:
  - AND:
    - 'ai<>id set '
    - ai<>week_beginning after 2026-08-22
  - THEN:
    - ACTION quickbase[oMVjzjY#chartindustries] bulk_record_set define -> aj:
        inputs-meta:
          app: '"Project Activity" <bg86uwfcw>'
          export_fields: '"Related Time Card, Hours, Day Index, Work Date, Employee,
            BU Code, BU Name, BU Full Name, Time Card Type, Time Card Title, Project
            Name, Project Type, Billable?" <22, 9, 7, 8, 10, 11, 12, 13, 18, 17, 15,
            16, 20>'
          merge_field: '"Day Key" <6>'
          table: '"Time Card Days" <bwe8cjimn>'
    - aj<>ACTION quickbase bulk_record_set create -> ak:
        inputs:
          billable: '{{ai.billable}}'
          bu_code: '{{ai.business_unit_code}}'
          bu_full_name: '{{ai.business_unit_full_name}}'
          bu_name: '{{ai.business_unit_name}}'
          day_index: '0'
          day_key: '{{ (ai.id | int) * 10 + 0 }}'
          employee: '{{ai.employee.email}}'
          hours: '{{ai.sunday}}'
          project_name: '{{ai.project_name}}'
          project_type: '{{ai.project_type}}'
          related_time_card: '{{ai.id}}'
          time_card_title: '{{ai.time_card_title}}'
          time_card_type: '{{ai.time_card_type}}'
          work_date: '{{ ai.week_beginning + time.delta(days=0) }}'
        name: Sunday - Add Bulk Upsert Row
    - aj<>ACTION quickbase bulk_record_set create -> al:
        inputs:
          billable: '{{ai.billable}}'
          bu_code: '{{ai.business_unit_code}}'
